[project]
name = "thesischeck"
version = "0.1.0"
description = "ThesisCheck rules engine: offline .docx thesis format checker"
requires-python = ">=3.14"
# Runtime dependencies — the same exact versions run in Pyodide in the browser.
dependencies = [
    "python-docx==1.2.0",
    "lxml==6.1.3",
    "typing-extensions==4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import `thesischeck`, `schema` and `tools` from engine/ without installing.
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # we use typographic quotes/dashes on purpose

[tool.ruff.lint.isort]
known-first-party = ["thesischeck", "schema", "tools", "conftest"]
